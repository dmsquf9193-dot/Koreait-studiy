<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
        }

        body {
            height: 1500px;
            background-color: white;
        }

        .navbar {
            background-color: #111;
            display: flex;
            justify-content: center;
            padding: 20px 30px;
            justify-content: space-between;
            align-items: center;

        }

        .logo {
            margin-right: 300px;
            color: aliceblue;
            display: flex;
        }

        ul {
            display: flex;
            gap: 30px;
            list-style: none;
        }

        a {
            text-decoration: none;
            color: aliceblue;
            display: inline-block;
        }

        .services {
            padding: 50px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .card {
            flex: 1 1 calc(33.333% - 20px);
            background: #f4f4f4;
            padding: 40px;
            text-align: center;
            border-radius: 10px;
            transition: 0.3s;
        }

        * {
            margin: 0;
            
            box-sizing: border-box;
            font-family: Arial;
        }   
        
        div {
            display: block;
            unicode-bidi: isolate;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="logo">My Company</div>
        <ul class="main-manu">

            <a href="">Home</a>

            <a href="">About</a>

            <a href="">Service</a>

            <a href="">Contact</a>

        </ul>
    </nav>


        <section class="Service">
            <p class="title">Service 1</p>
        </div>

        <div class="card">
            <p class="title">Service 2</p>
        </div>

        <div class="card">
            <p class="title">Service 3</p>
        </div>

        <div class="card">
            <p class="title">Service 4</p>
        </div>

        <div class="card">
            <p class="title">Service 5</p>
        </div>

        <div class="card">
            <p class="title">Service 6</p>
        </div>
        </section>

</body>

</html>
