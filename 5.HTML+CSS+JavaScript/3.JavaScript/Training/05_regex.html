<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS 실습용 대시보드</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./05_regex.css">
</head>
<body>
    <section class="login-section">
        <h2>로그인</h2>
        <div class="form-group">
            <label>아이디</label>
            <input type="text" id="login-id" placeholder="user 입력">
        </div>
        <div class="form-group">
            <label>비밀번호</label>
            <input type="password" id="login-pw" placeholder="qwer1234! 입력">
        </div>
        <button id="btn-login">로그인</button>
    </section>
    <script>
        //     <로그인>
        //      * 공통 : 비어있는 문자 불가(로그인 버튼 클릭 시)
        //      * const id = "user";   /  const pwd = "qwer1234!"
        //          - 아이디 또는 비밀번호를 입력하지 않을 경우 : alert "아이디 또는 비밀번호를 입력해주세요." 출력 
        //          - 아이디 또는 비밀번호가 일치하지 않을 경우 : alert "아이디 또는 비밀번호가 틀렸습니다." 출력
        //          - 위의 변수와 모두 일치 할 경우 : alert "로그인 되었습니다." 출력 
        const id ="user";
        const pwd = "qwer1234!"

        const loginBtn = document.getElementById("btn-login");

        loginBtn.addEventListener("click", function() {
            const inputId = document.getElementById("login-id").value;
            const inputPw = document.getElementById("login-pw").value;

            // 빈 값
            if(inputId === "" || inputPw === "") {
                alert("아이디 또는 비밀번호를 입력해주세요.");
                return;
            }

            // 아이디 또는 비번 틀림
            if(inputId !== id || inputPw !== pwd) {
                alert("아이디 또는 비밀번호가 틀렸습니다.");
                return;
            }

            alert("로그인 되었습니다.");
        })
    </script>


    <section class="portfolio-section">
        <h2>포트폴리오 추가</h2>
        <div class="form-group">
            <label>프로젝트 제목</label>
            <input type="text" id="port-title" placeholder="최대 100글자">
        </div>
        <div class="form-group">
            <label>설명</label>
            <textarea id="port-desc" placeholder="프로젝트 내용을 입력해주세요."></textarea>
        </div>
        <button id="btn-port">새로운 프로젝트 추가하기</button>
        <div id="portfolio-list"></div>
    </section>
    <script>
        //     <포트폴리오>
        //      - 제목은 최대 100글자까지 가능
        //      - 제목이 100글자를 초과하면 alert "제목이 너무 깁니다."

        //      * 공통 : 비어있는 문자 불가(새로운 프로젝트 추가하기 버튼 클릭 시)
        //          - 제목이 비어있다면 alert "제목을 입력해주세요"
        //          - 설명이 비어있다면 alert "설명을 입력해주세요."

        //      * 추가하기 성공 시
        //          - 아래의 코드를 참고하여 내용을 추가하세요. (클래스 및 텍스트 노드 추가)
        //             item.className = 'portfolio-item';
        //             item.innerHTML = `<strong>${portTitle.value}</strong><p style="margin:5px 0 0; font-size:0.9rem;">${portDesc.value}</p>`;

        const portTitle = document.getElementById("port-title");
        const portDesc = document.getElementById("port-desc");
        const btnPort = document.getElementById("btn-port");
        const portfolioList = document.getElementById("portfolio-list");

        btnPort.addEventListener("click", function() {
            const title = portTitle.value.trim();
            const desc = portDesc.value.trim();

            if(title === "") {
                alert("제목을 입력해주세요.");
                return;
            }

            if (desc === "") {
                alert("설명을 입력해주세요.");
                return;
            }

            if(title.length > 100) {
                alert("제목이 너무 깁니다.");
                return;
            }

            const item = document.createElement("div");

            item.className = "portfolio-item";

            item.innerHTML = `
            <strong>${title}</strong>
            <p style="margin:5px 0 0; font-size:0.9rem;">${desc}</p>`;

            portfolioList.appendChild(item);

            portTitle.value = "";
            portDesc.value = "";
        });
    </script>


    <section class="contact-section">
        <h2>연락하기</h2>
        <div class="form-group">
            <label>이름</label>
            <input type="text" id="contact-name" placeholder="한글 이름">
        </div>
        <div class="form-group">
            <label>이메일</label>
            <input type="email" id="contact-email" placeholder="example@test.com">
        </div>
        <div class="form-group">
            <label>메시지</label>
            <textarea id="contact-msg" maxlength="500" placeholder="메시지를 입력해 주세요 (최대 500자)"></textarea>
            <div class="char-count"><span id="msg-count">0</span> / 500</div>
        </div>
        <button id="btn-contact">전송</button>
    </section>
    <script>
        //     <연락하기>
        //      - 이름 : 한글만 가능
        //      - 이메일 : 이메일 주소가 유효한지 확인   ex) test@test.com
        //      - 메시지 : 사용자가 입력한 글자를 실시간으로 업데이트 / 최대 500글자까지 사용 가능

        //      * 전송 버튼 클릭 시
        //          - 이름에 한글말고 다른게 있으면 alert "이름은 한글만 사용 가능합니다"
        //          - 이메일 주소가 유효하지 않으면 alert "이메일 양식이 유효하지 않습니다."

        //     * 공통 : 비어있는 문자 불가(전송 버튼 클릭 시)
        //          - 이름이 비어있다면 alert "이름을 입력해주세요"
        //          - 이메일이 비어있다면 alert "이메일을 입력해주세요."
        //          - 메시지가 비어있다면 alert "메시지를 입력해주세요."

        const nameInput = document.getElementById("contact-name");
        const emailInput = document.getElementById("contact-email");
        const msgInput = document.getElementById("contact-msg");
        const msgCount = document.getElementById("msg-count");
        const btn = document.getElementById("btn-contact");

        // 한글만
        const KOREA_ONLY = /^[가-힣]+$/;

        // 이메일
        const EMAIL_REGEX = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
        
        // 메시지 글자수 업댓
        function updateCount() {
            msgCount.textContent = msgInput.value.length;
        }
        msgInput.addEventListener("input", updateCount);
        updateCount();

        btn.addEventListener("click", function() {
            const nameVal = nameInput.value.trim();
            const emailVal = emailInput.value.trim();
            const msgVal = msgInput.value.trim();

            // 빈값 불가
            if(nameVal === "") {
                alert("이름을 입력해주세요.");
                nameInput.focus();
                return
            }

            if(emailVal === "") {
                alert("이메일을 입력해주세요.");
                emailInput.focus();
                return;
            }

            if(msgVal === "") {
                alert("메시지를 입력해주세요.");
                msgInput.focus();
                return;
            }

            // 한글만 가능한 이름
            if(!KOREA_ONLY.test(nameVal)) {
                alert("이름은 한글만 사용 가능합니다.");
                nameInput.focus();
                return;
            }

            // 이메일 유효한지
            if(!EMAIL_REGEX.test(emailVal)) {
                alert("이메일 양식이 유효하지 않습니다.");
                emailInput.focus();
                return;
            }

            alert("전송 완료!");

            // 초기화
            nameInput.value = "";
            emailInput.value = "";
            msgInput.value = "";
            updateCount();
        });
    </script>


    <section class="join-section">
        <h2>회원가입</h2>
        <div class="form-group">
            <label>이름</label>
            <input type="text" id="join-name" placeholder="한글만 입력">
            <div id="msg-name" class="msg"></div>
        </div>
        <div class="form-group">
            <label>아이디</label>
            <input type="text" id="join-id" placeholder="5~20자 영문, 숫자, _, -">
            <div id="msg-id" class="msg"></div>
        </div>
        <div class="form-group">
            <label>비밀번호</label>
            <input type="password" id="join-pw" placeholder="8~16자 대소문자/특수/숫자 포함">
            <div id="msg-pw" class="msg"></div>
        </div>
        <div class="form-group">
            <label>비밀번호 확인</label>
            <input type="password" id="join-pw2" placeholder="비밀번호 재입력">
            <div id="msg-pw2" class="msg"></div>
        </div>
        <button id="btn-join">회원 가입</button>
    </section>
    <script>
        //     <회원가입>
        //      - 이름 : 한글만 가능
        //      - 아이디 : 영어, 숫자, 특수기호(_),(-)만 가능 / 5자 이상 20자 이하
        //      - 비밀번호 : 대소문자 또는 특수문자, 숫자 최소 1개 이상 / 8자리 이상 16자 이하
        //      - 비밀번호 확인 : 비밀번호와 동일해야 함

        //      * 일치하지 않을 경우 input의 아래 부분에 텍스트 출력(keyup 이벤트 활용)
        //          - 이름이 일치하지 않을 경우 : "한글만 사용 가능합니다."    // 색상 red
        //          - 이름이 일치할 경우 : ""   (빈 문자열 출력)

        //      - 아이디가 일치하지 않을 경우 : "5~20자의 영문 소문자, 숫자와 특수기호(_),(-)만 사용 가능합니다."    // 색상 red
        //      - 아이디가 일치할 경우 : "사용 가능한 아이디입니다."    // 색상 green

        //      - 비밀번호가 일치하지 않을 경우 : "8~16자의 영문 대/소문자, 숫자, 특수문자를 사용해 주세요."    // 색상 red
        //      - 비밀번호가 일치할 경우 : "사용 가능한 비밀번호입니다."    // 색상 green

        //      - 비밀번호 확인이 비밀번호와 일치하지 않을 경우 : 비밀번호가 일치하지 않습니다."    // 색상 red
        //      - 비밀번호 확인이 비밀번화 일치할 경우 : "비밀번호가 일치합니다."    // 색상 green

        //      * 공통 : 비어있는 문자 불가(회원 가입 버튼 클릭 시) 
        //          - 비어있다면 alert "이름을 입력해주세요."
        //          - 아이디가 비어있다면 alert "아이디를 입력해주세요."
        //          - 비밀번호가 비어있다면 alert "비밀번호를 입력해주세요."
        //          - 비밀번호 확인이 일치하지 않는다면 alert "비밀번호가 일치하지 않습니다"

	    //	    * 공통 : 모든 유효성 검사가 통과해야 회원가입 버튼 클릭 시 "회원가입이 완료되었습니다" alert 출력
	    // 		    - 유효성 검사가 1개라도 실패했다면 "입력값을 다시 확인해주세요." alert 출력

        const joinName = document.getElementById("join-name");
        const joinId = document.getElementById("join-id");
        const joinPw= document.getElementById("join-pw");
        const joinPw2= document.getElementById("join-pw2");
        
        const msgName= document.getElementById("msg-name");
        const msgId= document.getElementById("msg-id");
        const msgPw= document.getElementById("msg-pw");
        const msgPw2= document.getElementById("msg-pw2");

        const btnJoin= document.getElementById("btn-join");

        const NAME_REGEX = /^[가-힣]+$/;
        const ID_REGEX = /^[a-z0-9_-]{5,20}$/;
        const PW_REGEX = /^(?=.*\d)(?=.*([a-zA-z]|[^\w\s])).{8,16}$/;

        function setMsg(el, text, color) {
            el.textContent = text;
            if(color) el.style.color = color;
        }

        function validateName() {
            const v = joinName.value.trim();
            if(v === "") {
                setMsg(msgName, "", "");
                return false;
            }
            if(!NAME_REGEX.test(v)) {
                setMsg(msgName, "한글만 사용 가능합니다.", "red");
                return false;
            }
            setMsg(msgName, "", "");
            return true;
        }

        function validateId() {
            const v = joinId.value.trim();
            if(v === "") {
                setMsg(msgId, "", "");
                return false;
            }
            if(!ID_REGEX.test(v)) {
                setMsg(msgId, "5~20자의 영문 소문자, 숫자와 특수기호(_),(-)만 사용 가능합니다.", "red");
                return false;
            }
            setMsg(msgId, "사용 가능한 아이디 입니다.", "green");
            return true;
        }

        function validatePw() {
            const v = joinPw.value;
            if(v.trim() === "") {
                setMsg(msgPw, "", "");
                return false;
            }
            if(!PW_REGEX.test(v)) {
                setMsg(msgPw, "8~16자의 영문 대/소문자, 숫자, 특수문자를 사용해 주세요.", "red");
                return false;
            }
            setMsg(msgPw, "사용가능한 비밀번호입니다.", "green");
            return true;
        }

        function validatePw2() {
            const v1 = joinPw.value;
            const v2 = joinPw2.value;

            if(v2.trim() === "") {
                setMsg(msgPw2, "", "");
                return false;
            }

            if(v1 !== v2) {
                setMsg(msgPw2, "비밀번호가 일치하지 않습니다.", "red");
                return false;
            }
            setMsg(msgPw2, "비밀번호가 일치합니다.", "green");
            return true;
        }

        // 이벤트 연결
        joinName.addEventListener("keyup", validateName);
        joinId.addEventListener("keyup", validateId);
        joinPw.addEventListener("keyup", function() {
            validatePw();

            // 비번 바뀌면 확인도 다시 검사
            if(joinPw2,value.trim() !== "") validatePw2();
        });
        joinPw2.addEventListener("keyup", validatePw2);

        // 가입버튼 클릭 시 공통 검사
        btnJoin.addEventListener("click", function() {
            const nameVal = joinName.value.trim();
            const idVal = joinId.value.trim();
            const pwVal = joinPw.value.trim();
            const pw2Val = joinPw2.value.trim();

            // 빈값 alert (요구사항)
            if(nameVal === "") {
                alert("이름을 입력해주세요.");
                joinName.focus();
                return;
            }
            if(idVal === "") {
                alert("아이디를 입력해주세요.");
                joinId.focus();
                return;
            }
            if(pwVal === "") {
                alert("비밀번호를 입력해주세요.");
                joinPw.focus();
                return;
            }

            // 비번 확인 불일치 alert(요구사항)
            if(pwVal !== pw2Val) {
                alert("비밀번호가 일치하지 않습니다.");
                joinPw2.focus();
                return;
            }

            // 전체 쌉가능 검사
            const okName = validateName();
            const okId = validateId();
            const okPw = validatePw();
            const okPw2 = validatePw2();

            if(okName && okId && okPw && okPw2) {
                alert("회원가입이 완료되었습니다.");
            }else{
                alert("입력값을 다시 확인해주세요.");
            }
        });
    </script>
</body>
</html>
